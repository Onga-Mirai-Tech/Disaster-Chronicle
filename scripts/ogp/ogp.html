<!DOCTYPE html>
<!--
  リンクを貼り付けたときに表示されるカード画像（OGP画像 / ogp.png）の元デザイン。
  1200x630px で作る。変更したら scripts/ogp/generate.sh で ogp.png を作り直す。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 45%, #0ea5e9 100%);
    display: flex; align-items: center; justify-content: center;
    color: #0c4a6e;
  }
  .card {
    width: 1104px; height: 534px;
    background: #f8fcff;
    border-radius: 40px;
    box-shadow: 0 20px 50px rgba(12, 74, 110, 0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    padding-bottom: 60px;
  }
  .icon { width: 120px; height: 120px; margin-bottom: 22px; }
  .icon svg { width: 120px; height: 120px; }
  h1 { font-size: 96px; font-weight: 800; color: #075985; letter-spacing: 0.02em; line-height: 1.2; }
  .sub { font-size: 40px; font-weight: 700; color: #0369a1; letter-spacing: 0.06em; margin-top: 8px; }
  .tags { display: flex; gap: 12px; margin-top: 30px; }
  .tag {
    font-size: 26px; font-weight: 700; color: #075985;
    background: #e0f2fe; border: 2px solid #bae6fd;
    padding: 8px 20px; border-radius: 999px; white-space: nowrap;
  }
  .note { position: absolute; bottom: 26px; font-size: 22px; font-weight: 600; color: #0369a1; opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="14" fill="#0369a1"/>
        <path d="M8 38c6 0 6-6 12-6s6 6 12 6 6-6 12-6 6 6 12 6" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 50c6 0 6-6 12-6s6 6 12 6 6-6 12-6 6 6 12 6" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 26l10-14 10 14z" fill="#e0f2fe"/>
      </svg>
    </div>
    <h1>Disaster Chronicle</h1>
    <p class="sub">日本の災害アーカイブ検索</p>
    <div class="tags">
      <span class="tag">指定した日の前後</span>
      <span class="tag">過去の災害を振り返る</span>
      <span class="tag">地震・噴火・風水害</span>
    </div>
    <p class="note">disaster-chronicle.onga-mirai-tech.com</p>
  </div>
</body>
</html>
